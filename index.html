<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cofradía – Mitglieder</title><meta name="theme-color" content="#7a1f22">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--c:#7a1f22;--bg:#f7f3ef;--tx:#2a2020;--mu:#6d5f5f;--ln:#e2d8d0}
@media (prefers-color-scheme:dark){:root{--bg:#1d1818;--tx:#f1e9e4;--mu:#b8a9a4;--ln:#3a2f2f}.card,input,select,textarea,.sheet{background:#2a2222!important;color:var(--tx)!important}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--c);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1;line-height:1.2}header small{display:block;font-weight:400;opacity:.85;font-size:12px}
.lang button{background:transparent;color:#fff;border:1px solid #fff8;border-radius:8px;padding:6px 9px;font-size:13px}.lang button.on{background:#fff;color:var(--c);font-weight:700}
main{padding:12px 16px;max-width:760px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:transparent;color:var(--mu);padding:12px 4px;font-size:14px;min-height:56px}nav button.on{color:var(--c);font-weight:700;border-top:3px solid var(--c)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
input,select,textarea{font:inherit;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff;width:100%;min-height:46px}
textarea{min-height:76px}label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
.btn{background:var(--c);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;min-height:46px}.btn.alt{background:#0000;color:var(--c);border:1px solid var(--c)}.btn.s{padding:8px 12px;min-height:40px;font-size:15px}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px;margin:8px 0}
.card b{font-size:17px}.mu{color:var(--mu);font-size:14px}.tag{display:inline-block;background:#7a1f2218;color:var(--c);border-radius:6px;padding:1px 7px;font-size:12px;margin-left:6px}
.sum{background:#7a1f2210;border-left:4px solid var(--c);padding:10px 12px;border-radius:6px;margin:8px 0;font-size:15px}
.half{display:flex;gap:8px}.half>*{flex:1;min-width:0}
#ov{position:fixed;inset:0;background:#0007;z-index:10;display:none;overflow:auto}.sheet{background:var(--bg);margin:0 auto;max-width:760px;min-height:100%;padding:16px 16px 40px}
#toast{position:fixed;left:16px;right:16px;bottom:78px;background:#222;color:#fff;border-radius:10px;padding:12px 14px;z-index:20;display:none}#toast.err{background:#a02020}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0}.chk input{width:24px;height:24px;min-height:0}
</style></head><body>
<header><h1>Cofradía del Divino Nazareno y Santo Sepulcro<small id="hs"></small></h1><div class="lang" id="lg"></div></header>
<main id="m"></main><nav id="nv"></nav><div id="ov"></div><div id="toast"></div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body></html>
